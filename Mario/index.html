<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="flex.css">
</head>

<body>

<div class="mario-bros">
    <img src="./imagens/logo.png" alt="Mario-Bros.">
</div>

<div class="menu">
    <p>Novo Jogo</p>
    <p>Carregar Jogo</p>
</div>

<div class="personagens">
    <h1>Esolha seu personagem</h1>
    <div id="personagens-container">
        <div class="card">
            <img src="./imagens/personagens/mario.jpg" alt="Mario">
            <p>Mario</p>
        </div>
        <div class="card">
            <img src="./imagens/personagens/luigi.jpg" alt="Luigi">    
            <p>Luigi</p>
        </div>
        <div class="card">
            <img src="./imagens/personagens/yoshi.jpg" alt="Yoshi">    
            <p>Yoshi</p>
        </div>
        <div class="card">
            <img src="./imagens/personagens/toad.jpg" alt="Toad">    
            <p>Toad</p>
        </div>

    </div>
</div>

<div class="linha-verde">
    <p>linha-verde</p>
</div>

<div class="poderes">
    <h1>Colete poderes especiais</h1>
    <div id="poderes-container">
        <div class="poder-card">
            <img src="./imagens/poderes/cogumelo-vermelho.jpg" alt="Cogumelo Vermelho">
        </div>
        <div class="poder-card">
            <img src="./imagens/poderes/cogumelo-verde.jpg" alt="Cogumelo Verde">
        </div>
        <div class="poder-card">
            <img src="./imagens/poderes/cogumelo-azul.jpg" alt="Cogumelo Azul">
        </div>
        <div class="poder-card">
            <img src="./imagens/poderes/flor-fogo.jpg" alt="Flor de Fogo">
        </div>
        <div class="poder-card">
            <img src="./imagens/poderes/flor-gelo.jpg" alt="Flor de Gelo">
        </div>
        <div class="poder-card">
            <img src="./imagens/poderes/cogumelo-voador.jpg" alt="Cogumelo Voador">
        </div>
        <div class="poder-card">
            <img src="./imagens/poderes/estrela.jpg" alt="Estrela">
        </div>
        <div class="poder-card">
            <img src="./imagens/poderes/pinguim.jpg" alt="Pinquim">
        </div>

    </div>
</div>

<div class="mario-inimigos">
    <h1>Enfrente os inimigos</h1>
    <img src="./imagens/personagens/mario.jpg" alt="Mario">
    <div id="inimigos-container">
        <div class="inimigo-card">
            <img src="./imagens/viloes/bowser.jpg" alt="Bowser">
        </div>
        <div class="inimigo-card">
            <img src="./imagens/viloes/wario.jpg" alt="Wario">
        </div>
        <div class="inimigo-card">
            <img src="./imagens/viloes/bowser.jpg" alt="Bowser">
        </div>
        <div class="inimigo-card">
            <img src="./imagens/viloes/drybones.jpg" alt="Dry Bones">
        </div>
    </div>
</div>

<div class="linha-vermelha">
    <p>linha-vermelha</p>
</div>

<div class="reino">
    <div id="final">
        <div class="salve">
            <h1>E salve o reino!</h1>
        </div>
        <div class="final-container">
            <img src="./imagens/final/peach.png" alt="Peach">
            <img src="./imagens/final/castelo.png" alt="Castelo">
            <img src="./imagens/final/daisy.png" alt="Daisy">
        </div>
    </div>
</div>


<div class="linha-verde">
    <p>linha-verde</p>
</div>

</body>

</html>
